<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Stock Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .glass-morphism {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        body {
            background: linear-gradient(135deg, #86B6F6, #176B87);
            min-height: 100vh;
        }
        .modal {
            display: none;
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="p-4">
    <div class="container mx-auto glass-morphism p-6">
        <h1 class="text-3xl font-bold text-white mb-6">Tea Stock Maintenance</h1>

        <!-- Stock Entry Form -->
        <form id="stockForm" class="space-y-4 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="text-white">Packing Date</label>
                    <input type="date" id="packingDate" class="w-full p-2 rounded">
                </div>
                <div>
                    <label class="text-white">Lot No</label>
                    <input type="text" id="lotNo" class="w-full p-2 rounded">
                </div>
                <div>
                    <label class="text-white">Mark</label>
                    <select id="mark" class="w-full p-2 rounded">
                        <option value="PUTINBARI">PUTINBARI</option>
                        <option value="PUTINBARI GOLD">PUTINBARI GOLD</option>
                        <option value="PUTINBARI SILVER">PUTINBARI SILVER</option>
                        <option value="PUTINBARI CLASSIC">PUTINBARI CLASSIC</option>
                        <option value="PUTINBARI ROYAL">PUTINBARI ROYAL</option>
                        <option value="PUTINBARI STANDARD">PUTINBARI STANDARD</option>
                        <option value="TIGER HILL">TIGER HILL</option>
                        <option value="TRIPTI">TRIPTI</option>
                    </select>
                </div>
                <div>
                    <label class="text-white">Grade</label>
                    <input type="text" id="grade" class="w-full p-2 rounded">
                </div>
                <div>
                    <label class="text-white">Bags</label>
                    <input type="number" id="bags" class="w-full p-2 rounded">
                </div>
                <div>
                    <label class="text-white">KG per Bag</label>
                    <input type="number" id="kgPerBag" class="w-full p-2 rounded">
                </div>
                <div>
                    <label class="text-white">Total KG</label>
                    <input type="number" id="totalKg" class="w-full p-2 rounded" readonly>
                </div>
                <div>
                    <label class="text-white">Remarks</label>
                    <input type="text" id="remarks" class="w-full p-2 rounded">
                </div>
            </div>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Add Stock</button>
        </form>

        <!-- Stock List Controls -->
        <div class="flex flex-wrap gap-4 mb-4">
            <input type="text" id="searchLot" placeholder="Search Lot No" class="p-2 rounded">
            <select id="filterStatus" class="p-2 rounded">
                <option value="all">All</option>
                <option value="available">Available</option>
                <option value="sold">Sold</option>
                <option value="auction">Auction Transfer</option>
                <option value="billed">Billed</option>
            </select>
            <button id="getStockList" class="bg-green-500 text-white px-4 py-2 rounded">Get Stock List</button>
            <button id="printStock" class="bg-purple-500 text-white px-4 py-2 rounded">Print Stock List</button>
            <button id="exportExcel" class="bg-yellow-500 text-white px-4 py-2 rounded">Export to Excel</button>
        </div>

        <!-- Stock Table -->
        <div class="overflow-x-auto">
            <table id="stockTable" class="w-full text-white">
                <thead>
                    <tr class="border-b">
                        <th class="p-2">Date</th>
                        <th class="p-2">Lot No</th>
                        <th class="p-2">Mark</th>
                        <th class="p-2">Grade</th>
                        <th class="p-2">Bags</th>
                        <th class="p-2">KG/Bag</th>
                        <th class="p-2">Total KG</th>
                        <th class="p-2">Status</th>
                        <th class="p-2">Actions</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal for Status Change -->
    <div id="statusModal" class="modal fixed inset-0 flex items-center justify-center">
        <div class="glass-morphism p-6 max-w-md w-full">
            <h2 id="modalTitle" class="text-2xl text-white mb-4">Update Status</h2>
            <div id="modalContent" class="space-y-4">
                <!-- Dynamic content will be inserted here -->
            </div>
            <div class="flex justify-end mt-4 space-x-2">
                <button id="modalCancel" class="bg-gray-500 text-white px-4 py-2 rounded">Cancel</button>
                <button id="modalSave" class="bg-blue-500 text-white px-4 py-2 rounded">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize stock data array
        let stockData = [];

        // Form submission handler
        document.getElementById('stockForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newStock = {
                id: Date.now(),
                packingDate: document.getElementById('packingDate').value,
                lotNo: document.getElementById('lotNo').value,
                mark: document.getElementById('mark').value,
                grade: document.getElementById('grade').value,
                bags: parseInt(document.getElementById('bags').value),
                kgPerBag: parseFloat(document.getElementById('kgPerBag').value),
                totalKg: parseFloat(document.getElementById('totalKg').value),
                remarks: document.getElementById('remarks').value,
                status: 'available'
            };
            stockData.push(newStock);
            updateStockTable();
            this.reset();
        });

        // Calculate total KG automatically
        document.getElementById('bags').addEventListener('input', calculateTotal);
        document.getElementById('kgPerBag').addEventListener('input', calculateTotal);

        function calculateTotal() {
            const bags = document.getElementById('bags').value || 0;
            const kgPerBag = document.getElementById('kgPerBag').value || 0;
            document.getElementById('totalKg').value = (bags * kgPerBag).toFixed(2);
        }

        // Update stock table display
        function updateStockTable() {
            const tbody = document.getElementById('stockTableBody');
            const filterStatus = document.getElementById('filterStatus').value;
            const searchTerm = document.getElementById('searchLot').value.toLowerCase();

            tbody.innerHTML = '';
            
            let filteredData = stockData;
            if (filterStatus !== 'all') {
                filteredData = stockData.filter(item => item.status === filterStatus);
            }
            if (searchTerm) {
                filteredData = filteredData.filter(item => 
                    item.lotNo.toLowerCase().includes(searchTerm)
                );
            }

            filteredData.forEach(item => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td class="p-2">${item.packingDate}</td>
                    <td class="p-2">${item.lotNo}</td>
                    <td class="p-2">${item.mark}</td>
                    <td class="p-2">${item.grade}</td>
                    <td class="p-2">${item.bags}</td>
                    <td class="p-2">${item.kgPerBag}</td>
                    <td class="p-2">${item.totalKg}</td>
                    <td class="p-2">${item.status}</td>
                    <td class="p-2">
                        <button onclick="changeStatus(${item.id})" class="bg-blue-500 text-white px-2 py-1 rounded mr-2">
                            Change Status
                        </button>
                        <button onclick="deleteStock(${item.id})" class="bg-red-500 text-white px-2 py-1 rounded">
                            Delete
                        </button>
                    </td>
                `;
            });
        }

        // Status change modal handling
        function changeStatus(id) {
            const modal = document.getElementById('statusModal');
            const modalContent = document.getElementById('modalContent');
            const item = stockData.find(s => s.id === id);

            modalContent.innerHTML = `
                <select id="newStatus" class="w-full p-2 rounded mb-4">
                    <option value="available">Available</option>
                    <option value="sold">Sold</option>
                    <option value="auction">Auction Transfer</option>
                    <option value="billed">Billed</option>
                </select>
                <div id="additionalFields"></div>
            `;

            document.getElementById('newStatus').addEventListener('change', function() {
                const additionalFields = document.getElementById('additionalFields');
                switch(this.value) {
                    case 'sold':
                        additionalFields.innerHTML = `
                            <input type="text" id="brokerName" placeholder="Broker Name" class="w-full p-2 rounded mb-2">
                            <input type="date" id="bookingDate" class="w-full p-2 rounded">
                        `;
                        break;
                    case 'auction':
                        additionalFields.innerHTML = `
                            <input type="text" id="saleNo" placeholder="Sale No" class="w-full p-2 rounded mb-2">
                            <input type="date" id="transferDate" class="w-full p-2 rounded" value="${new Date().toISOString().split('T')[0]}">
                        `;
                        break;
                    case 'billed':
                        additionalFields.innerHTML = `
                            <input type="text" id="partyName" placeholder="Party Name" class="w-full p-2 rounded mb-2">
                            <input type="date" id="billDate" class="w-full p-2 rounded">
                        `;
                        break;
                    default:
                        additionalFields.innerHTML = '';
                }
            });

            modal.style.display = 'flex';

            document.getElementById('modalSave').onclick = function() {
                const newStatus = document.getElementById('newStatus').value;
                item.status = newStatus;
                
                // Save additional fields based on status
                switch(newStatus) {
                    case 'sold':
                        item.brokerName = document.getElementById('brokerName').value;
                        item.bookingDate = document.getElementById('bookingDate').value;
                        break;
                    case 'auction':
                        item.saleNo = document.getElementById('saleNo').value;
                        item.transferDate = document.getElementById('transferDate').value;
                        break;
                    case 'billed':
                        item.partyName = document.getElementById('partyName').value;
                        item.billDate = document.getElementById('billDate').value;
                        break;
                }
                
                modal.style.display = 'none';
                updateStockTable();
            };

            document.getElementById('modalCancel').onclick = function() {
                modal.style.display = 'none';
            };
        }

        // Delete stock item
        function deleteStock(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                stockData = stockData.filter(item => item.id !== id);
                updateStockTable();
            }
        }

        // Filter and search handlers
        document.getElementById('filterStatus').addEventListener('change', updateStockTable);
        document.getElementById('searchLot').addEventListener('input', updateStockTable);
        document.getElementById('getStockList').addEventListener('click', updateStockTable);

        // Print stock list
        document.getElementById('printStock').addEventListener('click', function() {
            window.print();
        });

        // Export to Excel
        document.getElementById('exportExcel').addEventListener('click', function() {
            let csv = 'Date,Lot No,Mark,Grade,Bags,KG/Bag,Total KG,Status\n';
            stockData.forEach(item => {
                csv += `${item.packingDate},${item.lotNo},${item.mark},${item.grade},${item.bags},${item.kgPerBag},${item.totalKg},${item.status}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'stock_list.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Initial table update
        updateStockTable();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
